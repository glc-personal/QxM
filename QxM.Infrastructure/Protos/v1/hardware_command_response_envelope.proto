syntax = "proto3";

package qxm.infrastructure.v1;

option csharp_namespace = "QxM.Infrastructure.Protos.v1";

import "google/protobuf/timestamp.proto";
import "v1/command_outcome.proto";
import "v1/hardware_error.proto";

message HardwareCommandResponseEnvelope {
  // Command Id (generated by the service)
  string command_id = 1;
  
  // Time the command had been completed at
  google.protobuf.Timestamp completed_at = 2;
  
  // Command Outcome
  CommandOutcome outcome = 3;
  
  // Response payload
  bytes response_payload = 4;
  
  // Hardware error if there is one
  HardwareError error = 5;
}
