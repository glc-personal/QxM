syntax = "proto3";

package qxm.infrastructure.v1;

option csharp_namespace = "QxM.Infrastructure.Protos.v1";

import "google/protobuf/timestamp.proto";

message HardwareCommandAcceptedEnvelope {
  // Command id (generated by service)
  string command_id = 1;
  
  // Accepted at (utc)
  google.protobuf.Timestamp accepted_at = 2;
}
