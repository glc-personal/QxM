syntax = "proto3";

package qxm.infrastructure.v1;

option csharp_namespace = "QxM.Infrastructure.Protos.v1.AtomicCommands";

message MoveAbsoluteCommand {
  // Address of the motor to be moved
  string address = 1;
  
  // Position to be moved to
  double position = 2;
  
  // Speed at which to move
  double speed = 3;
}
