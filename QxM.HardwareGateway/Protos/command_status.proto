syntax = "proto3";

option csharp_namespace = "QxM.HardwareGateway";

package qxm.ics;

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;        // Accepted by ICB (not necessarily executed yet)
  COMMAND_STATUS_COMPLETED = 2;       // Executed by the ICB successfully
  COMMAND_STATUS_REJECTED = 3;        // Refused due to state/safety/validation
  COMMAND_STATUS_FAILED = 4;          // Executed but failed
  COMMAND_STATUS_TIMED_OUT = 5;       // Gateway timed out awaiting completion
  COMMAND_STATUS_CANCELLED = 6;       // Cancelled by caller
}